# Box-level HAProxy config, lives at ~/haproxy.d/00-base.cfg on the Poco (copy, not symlink:
# it belongs to the box, not to this app). haproxy runs with -f ~/haproxy.d and loads every
# *.cfg there in name order. Each app symlinks its "backend <app>" file in as NN-<app>.cfg
# and the frontend routes <app>.poco.xn--bdk.dog to it. Unknown label -> mealprep.
global
    log stdout format raw local0 info
    maxconn 256
    stats socket /data/data/com.termux/files/home/haproxy.sock mode 600 level operator   # counters for monitoring/textfile.sh
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 900s
    http-reuse safe

frontend https
    bind :8443 ssl crt /data/data/com.termux/files/home/mealprep/tls/haproxy.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]
    http-response set-header Strict-Transport-Security "max-age=31536000"
    use_backend %[req.hdr(host),lower,field(1,.)]
    default_backend mealprep

# lab: stats page on the LAN only
frontend stats
    bind 192.168.1.106:8404
    stats enable
    stats uri /
    stats refresh 10s
